<style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#0F0D0E;color:#F7F1F4}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Mismo sistema del Diario de Lectura (tipografías, botones, ventanas) en negro, amarillo y rosa (siempre oscura).
   Cinco pestañas fijas abajo (Hoy, Recetas, Semana, Compras, Progreso); ventanas flotantes para ver y editar. */
:root {
  --bg: #0F0D0E;
  --surface: #1A1719;
  --field: #241F22;
  --ink: #F7F1F4;
  --muted: #A8979F;
  --line: #3A3035;
  --accent: #FF4F9A;
  --accent-ink: #140A0F;
  --accent-soft: #3A1A29;
  --accent-strong: #FF8CC0;
  --yellow: #FFD000;
  --yellow-soft: #2B240C;
  --yellow-line: #5A4A12;
  --yellow-ink: #FFD84D;
  --good: #6CCB82;
  --good-soft: #16241A;
  --good-line: #2C4A33;
  --warn: #FF9B6B;
  --warn-soft: #3A2016;
  --pill-ink: #1A1418;
  --shadow: 0 6px 24px rgba(0, 0, 0, .5);
  /* un color por grupo de alimentos */
  --g-V: #D3EBC3; --g-F: #F7C6D6; --g-C: #F6ECC3; --g-L: #FBDAC8; --g-PMB: #CBE6F7;
  --g-PM: #F6CFE0; --g-LD: #E1DDF6; --g-GS: #FFE2B5; --g-GP: #E8D8C6;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14.5px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 112px;
}
main { max-width: 640px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; touch-action: manipulation; }
button { cursor: pointer; border: 0; background: none; }
input, select, textarea {
  width: 100%; font-size: 16px; background: var(--field); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; min-height: 46px;
  min-width: 0; max-width: 100%; display: block;
}
textarea { resize: none; min-height: 120px; }
input[type="date"], input[type="number"], input[type="search"] { -webkit-appearance: none; appearance: none; text-align: left; }
input[type="date"]::-webkit-date-and-time-value { text-align: left; min-width: 0; }
select { text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 28.5px; line-height: 1.1; margin: 14px 0 4px; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 400; font-size: 18.5px; margin: 0 0 10px; }
h3 { font-family: var(--display); font-weight: 400; font-size: 15.5px; margin: 0; }
.sub { color: var(--muted); margin: 0 0 16px; font-size: 13.5px; }
.label { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; }
.row > * { min-width: 0; }
.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack > *, .grid2 > * { min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.btn { min-height: 48px; padding: 0 18px; border-radius: 14px; font-weight: 700; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
.btn.danger { background: transparent; color: var(--warn); border: 1.5px solid var(--line); }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 12.5px; flex: none; border-radius: 12px; }
.btn.icon { width: 40px; padding: 0; flex: none; }
.btn[disabled] { opacity: .5; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); font-weight: 600; font-size: 12.5px; color: var(--muted); background: var(--surface); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btitle { font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.meta { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.msg { margin: 0; color: var(--muted); }
.tag { display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.ok { background: var(--good-soft); color: var(--good); }
.tag.bad { background: var(--warn-soft); color: var(--warn); }
.gp { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; color: var(--pill-ink); white-space: nowrap; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar > i.full { background: var(--good); }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 5; box-shadow: var(--shadow); }
.note { background: var(--yellow-soft); border: 1px solid var(--yellow-line); border-radius: 14px; padding: 10px 12px; font-size: 12.5px; display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.note button { font-weight: 700; color: var(--accent); min-height: 36px; padding: 0 4px; flex: none; }
.empty { text-align: center; padding: 34px 12px; color: var(--muted); }
.empty b { display: block; font-family: var(--display); font-weight: 400; font-size: 18.5px; color: var(--ink); margin-bottom: 4px; }
.rhead { margin: 18px 0 8px; font-weight: 700; font-size: 11.5px; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 8px; }
.rhead i { flex: 1; border-top: 1.5px dashed var(--line); }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
/* pestañas */
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px max(6px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-right, 0px)); }
#tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 52px; font-size: 10px; font-weight: 700; color: var(--muted); border-radius: 12px; position: relative; }
#tabs button[aria-current="page"] { color: var(--accent); }
#tabs button[aria-current="page"]::after { content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 4px; border-radius: 0 0 4px 4px; background: var(--yellow); }
#tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
/* ventanas */
#sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: max(18px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); background: rgba(0, 0, 0, .65); overscroll-behavior: contain; touch-action: none; }
#sheet .panel { position: relative; width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; touch-action: pan-y; -webkit-overflow-scrolling: touch; background: var(--surface); border-radius: 22px; padding: 16px 18px 20px; box-shadow: 0 18px 50px rgba(0, 0, 0, .6); border: 1px solid var(--line); }
#sheet .panel > * { max-width: 100%; }
#sheet .sheettop { position: sticky; top: -16px; z-index: 3; height: 0; display: flex; justify-content: flex-end; margin-right: -8px; }
#sheet .sheetx { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 17px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 0 0 4px var(--surface); }
#sheet .panel h2:first-of-type { padding-right: 48px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--accent); color: var(--accent-ink); padding: 10px 16px; border-radius: 99px; font-size: 12.5px; font-weight: 600; max-width: 90%; text-align: center; }
.seg { display: flex; background: var(--accent-soft); border-radius: 13px; padding: 3px; margin-bottom: 14px; }
.seg button { flex: 1; min-height: 38px; border-radius: 10px; font-weight: 700; font-size: 12px; color: var(--accent); padding: 0 2px; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 4px rgba(0, 0, 0, .4); }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpis .card { background: var(--yellow-soft); border-color: var(--yellow-line); }
.kpis .label { color: var(--yellow-ink); }
.kpi b { display: block; font-family: var(--display); font-weight: 400; font-size: 26.5px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11.5px; color: var(--yellow-ink); }
/* Hoy */
.daynav { display: flex; align-items: center; gap: 8px; margin: 4px 0 14px; }
.daynav .dl { flex: 1; text-align: center; font-weight: 700; text-transform: capitalize; }
.gtrack { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font-size: 12.5px; }
.gtrack .gname { display: flex; align-items: center; gap: 8px; min-width: 0; }
.gtrack .gnum { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.gtrack .bar { grid-column: 1 / -1; height: 6px; margin-bottom: 6px; }
.meal { display: flex; flex-direction: column; gap: 10px; }
.meal.done { background: var(--good-soft); border-color: var(--good-line); }
.mhead { display: flex; align-items: baseline; gap: 8px; }
.mtime { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.mname { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.rname { font-family: var(--display); font-size: 17.5px; line-height: 1.2; overflow-wrap: anywhere; text-align: left; }
.check { width: 40px; height: 40px; flex: none; border-radius: 12px; border: 1.5px solid var(--line); display: grid; place-items: center; color: transparent; font-weight: 700; }
.check.on { background: var(--good); border-color: var(--good); color: var(--bg); }
/* receta */
.ing { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ing:last-child { border-bottom: 0; }
.ing .in { font-weight: 600; overflow-wrap: anywhere; }
.ing .iq { font-size: 12.5px; color: var(--muted); }
.ing .iq b { color: var(--ink); font-weight: 700; }
.ing .was { font-size: 11.5px; color: var(--accent); }
.ing.free .in { font-weight: 500; color: var(--muted); }
.swap { min-height: 36px; padding: 0 10px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12px; grid-row: span 3; }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.steps li::marker { color: var(--accent); font-weight: 700; }
.vgrid { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 11px 12px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); }
.opt.cur { border-color: var(--accent); background: var(--accent-soft); }
.opt .on { font-weight: 600; overflow-wrap: anywhere; }
.opt .oq { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.olist { display: flex; flex-direction: column; gap: 8px; }
/* editor */
.eitem { display: grid; grid-template-columns: minmax(0, 1fr) 84px 40px; gap: 8px; align-items: center; }
.eitem .pick { text-align: left; min-height: 46px; padding: 6px 12px; border-radius: 12px; background: var(--field); border: 1.5px solid var(--line); overflow-wrap: anywhere; }
.eitem .pick small { display: block; color: var(--muted); font-size: 11px; }
.eitem.free { grid-template-columns: minmax(0, 1fr) 110px 40px; }
/* semana */
.pday { padding: 12px 14px; }
.pday h3 { margin-bottom: 8px; }
.prow { display: grid; grid-template-columns: 74px minmax(0, 1fr) 40px; gap: 8px; align-items: center; margin-top: 6px; }
.prow .pl { font-size: 11px; font-weight: 700; color: var(--muted); line-height: 1.2; }
.prow .pl span { display: block; font-family: var(--mono); font-weight: 500; color: var(--accent); }
.prow .pomit { min-height: 42px; display: flex; align-items: center; padding: 6px 10px; border-radius: 12px; border: 1.5px dashed var(--yellow-line); color: var(--yellow-ink); font-size: 13px; overflow-wrap: anywhere; }
.prow select { min-height: 42px; padding: 8px 10px; font-size: 14px; }
/* compras */
.shop { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.shop:last-child { border-bottom: 0; }
.shop .box { width: 26px; height: 26px; flex: none; border-radius: 8px; border: 1.5px solid var(--line); display: grid; place-items: center; color: transparent; font-weight: 700; font-size: 14px; background: var(--field); }
.shop.on .box { background: var(--good); border-color: var(--good); color: var(--bg); }
.shop .sn { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.shop .sq { text-align: right; font-size: 12.5px; white-space: nowrap; }
.shop .sq small { display: block; color: var(--muted); font-size: 11px; }
.shop.on .sn, .shop.on .sq { color: var(--muted); text-decoration: line-through; }
/* progreso */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--body); font-size: 10px; fill: var(--muted); }
.chart .val { fill: var(--ink); font-weight: 700; font-size: 10.5px; }
.chart .hit { fill: transparent; cursor: pointer; }
.ctip { min-height: 18px; font-size: 12.5px; font-weight: 600; margin: 0 0 6px; font-variant-numeric: tabular-nums; }
.blist { display: flex; flex-direction: column; }
.bentry { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.bentry:last-child { border-bottom: 0; }
.bentry b { font-variant-numeric: tabular-nums; }
.eqg { display: grid; grid-template-columns: minmax(0, 1fr) repeat(5, 40px); gap: 4px; align-items: center; font-size: 12px; }
.eqg .eh { font-size: 9.5px; font-weight: 700; color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: .03em; }
.eqg .en { display: flex; align-items: center; gap: 6px; min-width: 0; line-height: 1.15; padding: 6px 0; }
.eqg .en small { display: block; color: var(--muted); font-size: 10.5px; }
.eqg .ev { text-align: center; font-family: var(--mono); font-size: 12.5px; padding: 8px 0; border-radius: 8px; background: var(--field); }
.eqg .ev.z { color: var(--line); background: transparent; }
.eqg input { min-height: 40px; padding: 4px 2px; text-align: center; border-radius: 10px; }
.up { color: var(--warn); } .down { color: var(--good); }
</style>
</head>
<body>

<main id="view"></main>
<button id="fab" class="btn primary fab" data-act="new-recipe" hidden>+ Receta</button>
<nav id="tabs" aria-label="Secciones">
  <button data-tab="hoy"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>Hoy</button>
  <button data-tab="recetas"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M9 8h6M9 12h6"/></svg>Recetas</button>
  <button data-tab="semana"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Semana</button>
  <button data-tab="compras"><svg viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 11h10.6L20 8H7"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>Compras</button>
  <button data-tab="progreso"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Progreso</button>
</nav>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script src="datos.js"></script>
<script>
(function () {
  "use strict";
  var APP_VERSION = 10;
  var LS = "recetario-v1";
  var DAY = 86400000;

  /* ---------- plan: grupos, tiempos de comida y equivalentes ---------- */
  var GROUPS = [
    { k: "V", n: "Verduras" }, { k: "F", n: "Frutas" }, { k: "C", n: "Cereales sin grasa" },
    { k: "L", n: "Leguminosas" }, { k: "PMB", n: "Proteína muy baja en grasa" }, { k: "PM", n: "Proteína moderada en grasa" },
    { k: "LD", n: "Leche descremada" }, { k: "GS", n: "Grasas sin proteína" }, { k: "GP", n: "Grasas con proteína" }
  ];
  var GBY = {}; GROUPS.forEach(function (g) { GBY[g.k] = g; });
  var MEALS = [
    { k: "des", n: "Desayuno", h: "9:00" }, { k: "c1", n: "Colación 1", h: "12:00" }, { k: "com", n: "Comida", h: "15:30" },
    { k: "c2", n: "Colación 2", h: "18:00" }, { k: "cen", n: "Cena", h: "21:00" }
  ];
  var MBY = {}; MEALS.forEach(function (m) { MBY[m.k] = m; });
  /* Tablas de equivalentes. La primera (la de las recetas originales) es la de Recomposición.
     Se pueden agregar otras (déficit calórico, volumen); la vigente se elige desde una fecha. */
  var TIPOS = { deficit: "Déficit calórico", recomposicion: "Recomposición", volumen: "Volumen" };
  var EQ_RECOMP = {
    des: { V: 2, C: 2, PM: 3, GS: 1 },
    c1: { F: 1, LD: 1 },
    com: { V: 2, C: 3, L: 1, PMB: 3, GS: 2 },
    c2: { F: 1, GP: 1 },
    cen: { V: 2, C: 1, PMB: 3, GS: 1 }
  };
  var BASE_PLAN = "recomp";
  function defaultPlans() { return [{ id: BASE_PLAN, n: "Recomposición", tipo: "recomposicion", eq: clone(EQ_RECOMP) }]; }
  var FOODS = window.RX_FOODS || [], FBY = {};
  FOODS.forEach(function (f) { FBY[f.id] = f; });

  /* ---------- estado ---------- */
  var S = loadLocal() || seed();
  var ui = { tab: "hoy", date: dayKey(Date.now()), meal: "des", sheet: null, edit: null, rv: null, tmp: {}, sub: null, pick: null, q: "", pg: "", confirm: false, tip: null, wtip: null, restore: null, body: null };
  var toastT = null, saveT = null;

  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  /* Semana: plan por días */

  /* Compras: suma lo que piden las recetas planeadas en el rango, con los cambios de ingrediente de cada día. */
  /* Solo cuenta lo que falta por comer: no entran los días que ya pasaron ni las comidas marcadas como hechas. */
  function shopData() {
    var days = rangeDays(S.plan.from, S.plan.to), today = dayKey(Date.now()), byFood = {}, free = {}, nMeals = 0, nDays = 0, nSkip = 0;
    days.forEach(function (k) {
      var d = dayById(k), any = false; if (!d) return;
      MEALS.forEach(function (m) {
        var s = d.m[m.k], r = s && s.r && recipeById(s.r); if (!r) return;
        if (k < today || s.d || d.skip) { nSkip++; return; }
        nMeals++; any = true;
        itemsFor(r, planOn(k)).forEach(function (it, i) {
          if (it.f && !(it.p > 0)) return;
          if (!it.f) { freeParts(it.t).forEach(function (t) { var key = norm(t); (free[key] = free[key] || { t: t, n: 0 }).n++; }); return; }
          var f = subFood(it, s.s, i); if (!f) return;
          byFood[f.id] = (byFood[f.id] || 0) + (+it.p || 0);
        });
      });
      if (any) nDays++;
    });
    return { byFood: byFood, free: free, nMeals: nMeals, nDays: nDays, nSkip: nSkip, key: S.plan.from + "|" + S.plan.to };
  }
  /* "Sal, pimienta y limón" → Sal · Pimienta · Limón, para juntar los condimentos repetidos. */
  function freeParts(t) {
    return String(t).replace(/\([^)]*\)|-?\s*opcional/gi, "").split(/,|\s+y\s+/).map(function (x) { x = x.trim(); return x ? x.charAt(0).toUpperCase() + x.slice(1) : ""; }).filter(Boolean);
  }
  function viewCompras() {
    var sd = shopData(), h = '<h1>Lista de compras</h1>';

          if (lh !== (sc[dd.id] || null)) return; // hay un cambio local sin subir: gana el de este dispositivo
          applyItem(c, dd.id, del ? null : x.v);
          if (rh) sc[dd.id] = rh; else delete sc[dd.id];
          ch = true;
        });
        if (ch) { saveSnap(snap); saveLocalOnly(); if (!ui.sheet) render(); }
        if (!qs.metadata.fromCache && cloud.state !== "pending") { cloud.state = "ok"; cloud.last = Date.now(); syncUi(); }
      }, function (er) { cloud.state = "error"; cloud.err = "No pude recibir cambios de la nube (" + ((er && er.code) || "error") + ")."; syncUi(); }));
    });
  }
  function syncSchedule() { if (!cloud.user) return; clearTimeout(cloud.pushT); cloud.pushT = setTimeout(syncPush, 1200); }
  function syncPush() {
    if (!cloud.user || !cloud.db) return;
    var snap = loadSnap(); if (!snap || snap.uid !== cloud.user.uid) return;
    var cur = curMaps(), ops = [], now = Date.now();
    Object.keys(cur).forEach(function (c) {
      var sc = snap.c[c] = snap.c[c] || {};
      Object.keys(cur[c]).forEach(function (id) { var hh = hashStr(cur[c][id]); if (sc[id] !== hh) { ops.push([c, id, { v: cur[c][id], u: now, del: false }]); sc[id] = hh; } });
      Object.keys(sc).forEach(function (id) { if (!(id in cur[c])) { ops.push([c, id, { u: now, del: true }]); delete sc[id]; } });
    });
    if (!ops.length) return;
    saveSnap(snap);
    cloud.state = "pending"; syncUi();
    var commits = [];
    for (var i = 0; i < ops.length; i += 100) {
      var b = cloud.db.batch();
      ops.slice(i, i + 100).forEach(function (o) { b.set(userCol(o[0]).doc(o[1]), o[2]); });
      commits.push(b.commit());
    }
    Promise.all(commits).then(function () { cloud.state = "ok"; cloud.last = Date.now(); syncUi(); }).catch(function (er) {
      var s2 = loadSnap(); if (s2 && s2.c) { ops.forEach(function (o) { (s2.c[o[0]] = s2.c[o[0]] || {})[o[1]] = "reintentar"; }); saveSnap(s2); }
      cloud.state = "error"; cloud.err = "No pude subir tus cambios (" + ((er && er.code) || "error") + "). Se reintentará.";
      syncUi();
    });
  }
  function syncCard() {
    var h = '<h2 style="margin-top:28px">Cuenta y sincronización</h2><div class="card stack">';
    if (cloud.user) {
      h += '<p class="msg" style="font-size:12.5px">Sincronizando con <b>' + esc(cloud.user.email || "tu cuenta de Google") + "</b>. Tus recetas, plan y registros se guardan en tu nube y aparecen en todos tus dispositivos.</p>";
      h += '<p class="meta"' + (cloud.state === "error" ? ' style="color:var(--warn)"' : "") + ">" + esc(syncText()) + "</p>";
      h += '<button class="btn ghost block" data-act="sync-out">Cerrar sesión</button>';
    } else {
      if (!cloud.ready && navigator.onLine !== false) loadFirebase().catch(function () { syncUi(); });
      h += '<p class="msg" style="font-size:12.5px">Inicia sesión con tu cuenta de Google para respaldar tus datos en la nube y verlos en todos tus dispositivos. Lo que tienes en este teléfono se sube y no se borra nada.</p>';
      if (cloud.err) h += '<p class="meta" style="color:var(--warn)">' + esc(cloud.err) + "</p>";
      h += '<button class="btn primary block" data-act="sync-in"' + (cloud.ready ? "" : " disabled") + ">" + (cloud.ready ? "Iniciar sesión con Google" : navigator.onLine === false ? "Conéctate a internet para iniciar sesión" : cloud.loading ? "Preparando…" : "Toca para reintentar") + "</button>";
    }
    return h + "</div>";
  }
  function signIn() {
    if (!cloud.ready) { loadFirebase().catch(function () { syncUi(); }); render(); return; }
    cloud.err = "";
    var gp = new firebase.auth.GoogleAuthProvider(); gp.setCustomParameters({ prompt: "select_account" });
    firebase.auth().signInWithPopup(gp).catch(function (er) {
      if (er && /popup-blocked|operation-not-supported-in-this-environment/.test(er.code || "")) return firebase.auth().signInWithRedirect(gp);
      cloud.err = authErr(er); syncUi();
    });
  }
  function signOut() {
    stopListen(); clearTimeout(cloud.pushT);
    try { localStorage.removeItem(LS_SYNC); } catch (e) {}
    if (window.firebase && firebase.auth) firebase.auth().signOut().catch(function () {});
    cloud.user = null; cloud.state = "off"; render(); toast("Sesión cerrada. Tus datos siguen en este teléfono.");
  }

  /* ---------- arranque ---------- */
  var added = mergeBase();
  if (added) { persist(); setTimeout(function () { toast(added === 1 ? "Se agregó 1 receta nueva al recetario" : "Se agregaron " + added + " recetas nuevas al recetario"); }, 600); }
  render();
  // Si ya iniciaste sesión antes (aquí o en el Diario, mismo proyecto), la sincronización arranca sola.
  try { if (loadSnap() && navigator.onLine !== false) loadFirebase().catch(function () {}); } catch (e) {}
  window.addEventListener("online", function () { if (cloud.user) syncPush(); else syncUi(); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && ui.tab === "hoy" && !ui.sheet) render(); });
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
